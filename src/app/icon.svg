<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="45%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="qGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#4f46e5" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle border -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#glow)" />
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" />

  <!-- Inner Ambient Glow Ring -->
  <circle cx="236" cy="226" r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="36" />

  <!-- Stylized "Q" Ring -->
  <circle cx="236" cy="226" r="110" fill="none" stroke="url(#qGrad)" stroke-width="40" stroke-linecap="round" />

  <!-- Center Download Stream Arrow inside the Q -->
  <path d="M236 150 V 266 M 190 220 L 236 270 L 282 220" stroke="url(#streamGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Q Stream Tail -->
  <path d="M 288 280 L 372 364 M 332 376 H 388 V 320" stroke="url(#streamGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
</svg>
